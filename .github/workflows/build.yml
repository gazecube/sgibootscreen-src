name: Build SGI bootscreens

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p obj
          make
          ./sgibootscreen
      - name: Collect GraVT variants
        run: |
          mkdir -p artifacts
          cp indigo2.bmp artifacts/gravt-indigo2.bmp
          cp indy.bmp artifacts/gravt-indy.bmp
      - uses: actions/upload-artifact@v4
        with:
          name: gravt-bootscreens
          path: artifacts/*.bmp
